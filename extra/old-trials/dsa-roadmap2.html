/* ------------------------------------------------------------- HELPERS */
const LEVEL = { E: ['Easy', 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300'],
                M: ['Medium', 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300'],
                H: ['Hard', 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300'] };

const slugify = t => t.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s-]+/g, '-');
const norm = t => (t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* --------------------------------------------------------------- STATE */
const state = {
  username: lsGet('dsa.username', ''),
  solved: lsGet('dsa.solved', {}),      // { username: { normTitle: timestampSeconds } }
  windowDays: lsGet('dsa.window', 0),   // 0 = every fetched submission
  profile: lsGet('dsa.profile', null),
  lastSync: lsGet('dsa.lastSync', null),
  syncing: false,
  error: ''
};
const urlCache = lsGet('dsa.urls', {});

function solvedMap() { return state.solved[state.username] || {}; }
function solvedTs(title) {
  const ts = solvedMap()[norm(title)];
  if (!ts) return 0;
  if (state.windowDays > 0 && ts < Date.now() / 1000 - state.windowDays * 86400) return 0;
  return ts;
}
function isSolved(q) { return solvedTs(q[1]) > 0; }

function topicStats(t) {
  const req = t.q.filter(q => q[2] !== 'H');
  const reqDone = req.filter(isSolved).length;
  const allDone = t.q.filter(isSolved).length;
  const cpDone = t.cp.filter(isSolved).length;
  const complete = !!state.username && reqDone === req.length && cpDone >= 4;
  const total = t.q.length + t.cp.length;
  const done = allDone + cpDone;
  return { req: req.length, reqDone, allDone, cpDone, complete, total, done, pct: Math.round(done / total * 100) };
}

function ago(ts) {
  const d = Math.floor((Date.now() / 1000 - ts) / 86400);
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 30) return d + ' days ago';
  return Math.floor(d / 30) + ' mo ago';
}

/* ----------------------------------------------------------------- API */
async function syncUser(name) {
  name = name.trim();
  if (!name) return;
  state.syncing = true; state.error = ''; render();
  try {
    const [pRes, sRes] = await Promise.all([
      fetch(`${API}/user/${encodeURIComponent(name)}`, { headers: { accept: '*/*' } }),
      fetch(`${API}/user/${encodeURIComponent(name)}/submissions?limit=100`, { headers: { accept: '*/*' } })
    ]);
    if (!pRes.ok) throw new Error(pRes.status === 404 || pRes.status === 422 ? 'User not found. Check the username.' : 'Profile request failed (' + pRes.status + ').');
    if (!sRes.ok) throw new Error('Submissions request failed (' + sRes.status + ').');
    const profile = await pRes.json();
    const subs = await sRes.json();
    if (state.username !== name) { state.username = name; }
    const map = state.solved[name] || {};
    (Array.isArray(subs) ? subs : []).forEach(s => {
      if (s.statusDisplay !== 'Accepted') return;
      const ts = parseInt(s.timestamp, 10) || 0;
      [norm(s.title), norm((s.titleSlug || '').replace(/-/g, ' '))].forEach(k => { if (k && (!map[k] || map[k] < ts)) map[k] = ts; });
    });
    state.solved[name] = map;
    state.profile = profile;
    state.lastSync = Date.now();
    lsSet('dsa.username', name); lsSet('dsa.solved', state.solved); lsSet('dsa.profile', profile); lsSet('dsa.lastSync', state.lastSync);
  } catch (e) {
    state.error = e.message && e.message !== 'Failed to fetch' ? e.message : 'Could not reach the LeetCode API. Check your connection and try again.';
  }
  state.syncing = false; render();
}

async function openProblem(num, title) {
  const fallback = `https://leetcode.com/problems/${slugify(title)}/`;
  if (urlCache[num]) { window.open(urlCache[num], '_blank', 'noopener'); return; }
  const win = window.open('', '_blank');          // opened synchronously so popup blockers allow it
  let url = fallback;
  try {
    const r = await fetch(`${API}/problem/${num}`, { headers: { accept: '*/*' } });
    if (r.ok) { const j = await r.json(); if (j.url) { url = j.url; urlCache[num] = url; lsSet('dsa.urls', urlCache); } }
  } catch (e) {}
  if (win) { win.opener = null; win.location.href = url; } else { window.open(url, '_blank', 'noopener'); }
}

function overall() {
  const stats = TOPICS.map(topicStats);
  const total = stats.reduce((a, s) => a + s.total, 0), done = stats.reduce((a, s) => a + s.done, 0);
  const firstOpen = stats.findIndex(s => !s.complete);
  return { stats, total, done, pct: Math.round(done / total * 100), topicsDone: stats.filter(s => s.complete).length, nextTopic: firstOpen < 0 ? null : TOPICS[firstOpen] };
}

function status(done, size = 'w-5 h-5') {
  return done
    ? `<span class="${size} rounded-full bg-emerald-500 text-white grid place-items-center shrink-0 tick-pop">${icons.check}</span>`
    : `<span class="${size} rounded-full border-2 border-stone-300 dark:border-zinc-700 shrink-0"></span>`;
}
function bar(pct, color = 'bg-orange-500') {
  return `<div class="h-1.5 rounded-full bg-stone-200 dark:bg-zinc-800 overflow-hidden"><div class="${color} h-full rounded-full transition-all duration-500" style="width:${pct}%"></div></div>`;
}
function ring(pct, size, stroke, inner) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<div class="relative shrink-0" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" class="-rotate-90"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" class="stroke-stone-200 dark:stroke-zinc-800"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" class="stroke-orange-500 transition-all duration-700" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}"/></svg>
    <div class="absolute inset-0 grid place-items-center text-center">${inner}</div></div>`;
}

function renderNav(route) {
  const items = [['intro', 'Intro'], ['topics', 'Topics'], ['next', 'Next prep']];
  const html = items.map(([k, label]) => {
    const active = route === k || (k === 'topics' && route === 'topic');
    return `<a href="#/${k}" class="px-3 py-1.5 rounded-lg whitespace-nowrap font-medium ${active ? 'bg-stone-900 text-white dark:bg-zinc-100 dark:text-zinc-900' : 'text-stone-600 dark:text-zinc-400 hover:bg-stone-100 dark:hover:bg-zinc-900'}">${label}</a>`;
  }).join('');
  document.getElementById('nav').innerHTML = html;
  document.getElementById('navMobile').innerHTML = html;
  const o = overall();
  const ov = document.getElementById('overall');
  ov.innerHTML = `<span class="font-mono">${o.done}/${o.total}</span><span class="w-24">${bar(o.pct)}</span>`;
  const chip = document.getElementById('userChip');
  if (state.username) {
    const av = state.profile && state.profile.profile && state.profile.profile.userAvatar;
    chip.classList.remove('hidden');
    chip.innerHTML = `${av ? `<img src="${esc(av)}" class="w-7 h-7 rounded-full ring-1 ring-stone-200 dark:ring-zinc-700" alt="">` : ''}<span class="font-medium">${esc(state.username)}</span>`;
  } else chip.classList.add('hidden');
}

  return `<div class="mt-5 pt-5 border-t border-stone-200 dark:border-zinc-800">
    <div class="flex items-center gap-3">
      ${pr.userAvatar ? `<img src="${esc(pr.userAvatar)}" class="w-10 h-10 rounded-full" alt="">` : ''}

}

        <div class="flex items-center justify-between">
          <span class="font-mono text-3xl font-semibold ${s.complete ? 'text-emerald-500' : 'text-stone-300 dark:text-zinc-700'}">${pad2(t.id)}</span>
          ${s.complete ? status(true, 'w-7 h-7') : isNext ? '<span class="text-[11px] font-semibold uppercase tracking-wide rounded-full bg-orange-500 text-white px-2.5 py-1">Up next</span>' : `<span class="font-mono text-xs text-stone-400">${s.pct}%</span>`}
        </div>
        <div class="mt-3 font-semibold text-lg leading-snug">${t.name}</div>
        <div class="text-sm text-stone-500">${t.q.length} questions + 5 checkpoint · ${t.weeks}</div>
        <div class="mt-4 flex flex-wrap items-center gap-1">${dots}</div>
        <div class="mt-4 flex items-center justify-between text-sm"><span class="font-mono text-stone-500">${s.done}/${s.total}</span><span class="inline-flex items-center gap-1 font-medium text-stone-400 group-hover:text-orange-500">Open ${icons.arrow}</span></div>
      </a>`; }).join('')}
  </div></div>`;
}

function questionRow(q, nextKey, key) {
  const ts = solvedTs(q[1]);
  const [lvl, lvlCls] = LVL[q[2]];
  const isNextUp = key === nextKey;
  return `<li class="group flex items-center gap-3 sm:gap-4 pl-3 pr-4 py-3 border-l-2 ${isNextUp ? 'border-orange-500 bg-orange-50/70 dark:bg-orange-500/5' : 'border-transparent hover:bg-stone-50 dark:hover:bg-zinc-800/40'}">
    ${status(!!ts)}
    <span class="w-12 shrink-0 font-mono text-xs text-stone-400">#${q[0]}</span>
    <div class="min-w-0 flex-1">
      <a href="https://leetcode.com/problems/${slugify(q[1])}/" data-num="${q[0]}" data-title="${esc(q[1])}" class="qlink block truncate font-medium hover:text-orange-600 dark:hover:text-orange-400 ${ts ? 'text-stone-500 dark:text-zinc-400' : ''}">${esc(q[1])}</a>
      <div class="mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs">
        <span class="rounded bg-stone-100 dark:bg-zinc-800 text-stone-600 dark:text-zinc-400 px-1.5 py-0.5">${esc(q[3])}</span>
        ${isNextUp ? '<span class="font-semibold text-orange-600 dark:text-orange-400">Up next</span>' : ''}
        ${ts ? `<span class="text-emerald-600 dark:text-emerald-400">Solved ${ago(ts)}</span>` : ''}
      </div>
    </div>
    <span class="hidden sm:block w-16 text-right text-xs font-semibold ${lvlCls}">${lvl}${q[2] === 'H' ? '*' : ''}</span>
    <a href="https://leetcode.com/problems/${slugify(q[1])}/" data-num="${q[0]}" data-title="${esc(q[1])}" class="qlink shrink-0 inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold ${ts ? 'border border-stone-200 dark:border-zinc-700 text-stone-600 dark:text-zinc-400 hover:bg-stone-100 dark:hover:bg-zinc-800' : 'bg-stone-900 text-white dark:bg-zinc-100 dark:text-zinc-900 hover:opacity-85'}">${ts ? 'Review' : 'Solve'} ${icons.ext}</a>
  </li>`;
}

function patternsHtml(t) {
  return t.patterns.map(p => `<li class="py-2.5"><div class="text-sm font-semibold">${esc(p[0])}</div><div class="text-sm text-stone-500 dark:text-zinc-400 mt-0.5">${esc(p[1])}</div></li>`).join('');
}

function pageTopic(id) {
  const idx = TOPICS.findIndex(t => t.id === id);
  if (idx < 0) return pageTopics();
  const t = TOPICS[idx], s = topicStats(t);
  const prev = TOPICS[idx - 1], next = TOPICS[idx + 1];
  const o = overall();

  // first unsolved required question is "up next"
  let nextKey = null;
  if (state.username) {
    const iq = t.q.findIndex(q => q[2] !== 'H' && !isSolved(q));
    if (iq >= 0) nextKey = 'q' + iq;
    else { const ic = t.cp.findIndex(q => !isSolved(q)); if (ic >= 0 && s.cpDone < 4) nextKey = 'c' + ic; }
  }
  const rows = (list, pre) => {
    const items = list.map((q, i) => ({ q, i })).filter(x => !(state.hideSolved && isSolved(x.q)));
    return items.length ? items.map(x => questionRow(x.q, nextKey, pre + x.i)).join('') : '<li class="px-4 py-6 text-center text-sm text-stone-500">Everything here is solved.</li>';
  };

  return `<div class="fade-in grid lg:grid-cols-[230px_minmax(0,1fr)] xl:grid-cols-[230px_minmax(0,1fr)_300px] gap-8">
  <aside class="hidden lg:block">
    <div class="sticky top-20">
      <div class="text-xs font-semibold uppercase tracking-widest text-stone-400 mb-2 px-2">Topics</div>
      <nav class="space-y-0.5">
        ${TOPICS.map((x, i) => { const sx = o.stats[i], active = x.id === t.id; return `<a href="#/topic/${x.id}" class="flex items-center gap-2.5 rounded-lg px-2 py-1.5 text-sm ${active ? 'bg-stone-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-medium' : 'text-stone-600 dark:text-zinc-400 hover:bg-stone-100 dark:hover:bg-zinc-900'}">
          <span class="font-mono text-xs w-5 ${active ? 'opacity-70' : 'text-stone-400'}">${pad2(x.id)}</span>
          <span class="flex-1 truncate">${x.name}</span>
          ${sx.complete ? `<span class="text-emerald-500">${icons.check}</span>` : `<span class="font-mono text-[10px] ${active ? 'opacity-70' : 'text-stone-400'}">${sx.pct}%</span>`}</a>`; }).join('')}
      </nav>
    </div>
  </aside>

  <section class="min-w-0">
    <a href="#/topics" class="lg:hidden text-sm text-stone-500 hover:text-orange-500">&larr; All topics</a>
    <div class="font-mono text-xs uppercase tracking-widest text-orange-600 dark:text-orange-400 mt-2 lg:mt-0">Topic ${pad2(t.id)} · ${t.weeks}</div>
    <h1 class="mt-1 text-3xl font-extrabold tracking-tight flex items-center gap-3">${t.name}${s.complete ? status(true, 'w-8 h-8') : ''}</h1>
    <p class="mt-2 text-stone-600 dark:text-zinc-400 max-w-2xl">${esc(t.intro)}</p>

    ${s.complete ? `<div class="mt-5 rounded-xl border border-emerald-300 dark:border-emerald-500/40 bg-emerald-50 dark:bg-emerald-500/10 px-4 py-3 text-sm text-emerald-800 dark:text-emerald-200 flex items-center justify-between gap-3 flex-wrap">
      <span class="font-medium">Topic complete. Nice work.</span>
      ${next ? `<a href="#/topic/${next.id}" class="font-semibold inline-flex items-center gap-1.5">Next: ${esc(next.name)} ${icons.arrow}</a>` : `<a href="#/next" class="font-semibold inline-flex items-center gap-1.5">Next preparation ${icons.arrow}</a>`}</div>` : ''}

    <div class="mt-5 grid grid-cols-2 gap-3">
      <div class="${card} p-4"><div class="flex justify-between text-sm"><span class="font-medium">Questions</span><span class="font-mono text-stone-500">${s.reqDone}/${s.req}</span></div><div class="mt-2.5">${bar(Math.round(s.reqDone / s.req * 100))}</div></div>
      <div class="${card} p-4"><div class="flex justify-between text-sm"><span class="font-medium">Checkpoint <span class="text-stone-400 font-normal">need 4</span></span><span class="font-mono text-stone-500">${s.cpDone}/5</span></div><div class="mt-2.5">${bar(Math.round(s.cpDone / 5 * 100), 'bg-violet-500')}</div></div>
    </div>

    ${!state.username ? `<a href="#/intro" class="mt-4 block rounded-xl border border-orange-300 dark:border-orange-500/40 bg-orange-50 dark:bg-orange-500/10 text-orange-800 dark:text-orange-200 px-4 py-3 text-sm">Add your LeetCode username on the intro page to enable ticks. &rarr;</a>` : ''}

    <details class="xl:hidden mt-5 ${card}">
      <summary class="flex items-center justify-between px-4 py-3 cursor-pointer font-semibold">Patterns to learn <span class="text-stone-400">${icons.chev}</span></summary>
      <ul class="px-4 pb-3 divide-y divide-stone-100 dark:divide-zinc-800">${patternsHtml(t)}</ul>
    </details>

    <div class="mt-8 flex items-center justify-between gap-3 flex-wrap">
      <h2 class="text-lg font-bold">Questions <span class="text-stone-400 font-normal text-sm ml-1">solve in this order</span></h2>
      <div class="flex items-center gap-2">
        <button class="hideBtn text-sm rounded-lg border border-stone-200 dark:border-zinc-800 px-3 py-1.5 hover:bg-stone-100 dark:hover:bg-zinc-900 ${state.hideSolved ? 'bg-stone-100 dark:bg-zinc-900' : ''}">${state.hideSolved ? 'Show solved' : 'Hide solved'}</button>
        <button class="syncBtn text-sm inline-flex items-center gap-1.5 rounded-lg border border-stone-200 dark:border-zinc-800 px-3 py-1.5 hover:bg-stone-100 dark:hover:bg-zinc-900 ${state.username ? '' : 'hidden'}"><span class="${state.syncing ? 'spin' : ''}">${icons.sync}</span>${state.syncing ? 'Syncing' : 'Sync'}</button>
      </div>
    </div>
    <ul class="mt-3 ${card} divide-y divide-stone-100 dark:divide-zinc-800 overflow-hidden">${rows(t.q, 'q')}</ul>
    <p class="mt-2 text-xs text-stone-400">* Hard questions are optional for finishing the topic.</p>

    <div class="mt-9">
      <h2 class="text-lg font-bold">Checkpoint <span class="text-stone-400 font-normal text-sm ml-1">5 mixed problems, patterns plus classics</span></h2>
      <p class="mt-1 text-sm text-stone-500">Cap each at 45 minutes. Solve 4 of 5 to finish the topic.</p>
    </div>
    <ul class="mt-3 ${card} divide-y divide-stone-100 dark:divide-zinc-800 overflow-hidden">${rows(t.cp, 'c')}</ul>

    <div class="mt-10 flex justify-between gap-3">
      ${prev ? `<a href="#/topic/${prev.id}" class="rounded-xl border border-stone-200 dark:border-zinc-800 px-4 py-2.5 text-sm font-medium hover:bg-stone-100 dark:hover:bg-zinc-900">&larr; ${esc(prev.name)}</a>` : '<span></span>'}
      ${next ? `<a href="#/topic/${next.id}" class="rounded-xl bg-stone-900 text-white dark:bg-zinc-100 dark:text-zinc-900 px-4 py-2.5 text-sm font-semibold inline-flex items-center gap-2 hover:opacity-90">${esc(next.name)} ${icons.arrow}</a>`
             : `<a href="#/next" class="rounded-xl bg-orange-500 text-white px-4 py-2.5 text-sm font-semibold inline-flex items-center gap-2 hover:bg-orange-600">Next preparation ${icons.arrow}</a>`}
    </div>
  </section>

  <aside class="hidden xl:block">
    <div class="sticky top-20 ${card} p-5">
      <h2 class="font-bold">Patterns to learn</h2>
      <p class="text-xs text-stone-500 mt-0.5">Name the pattern before you code.</p>
      <ul class="mt-2 divide-y divide-stone-100 dark:divide-zinc-800 max-h-[calc(100vh-11rem)] overflow-y-auto pr-1">${patternsHtml(t)}</ul>
    </div>
  </aside>
  </div>`;
}

function pageNext() {
  const o = overall();
  const steps = [
    ['Redo the skipped Hards', 'Return to every Hard problem marked optional. Start with topics 3, 4 and 8.'],
    ['Random Mediums, no label', 'Solve 3 to 5 random Mediums a week and name the pattern before writing code. Spotting the pattern is the real interview skill.'],
    ['Re-solve from memory', 'Pick 10 problems you needed hints for and solve them again cold, in C++, with a timer.'],
    ['Weekly timed set', 'Once a week do 2 Mediums in 60 minutes, no hints. Review every miss.'],
    ['Weekly contests', 'Join a LeetCode contest. Aim to solve the first two problems in time, then grow from there.'],
    ['Add depth topics', 'Tries, segment trees and Fenwick trees, bit manipulation, advanced graphs (Bellman-Ford, Floyd-Warshall, SCC).']];
  return `<div class="fade-in max-w-3xl">
  <div class="font-mono text-xs uppercase tracking-widest text-orange-600 dark:text-orange-400">After the 12 topics</div>
  <h1 class="mt-1 text-3xl font-extrabold tracking-tight">Next preparation</h1>
  <p class="mt-2 text-stone-600 dark:text-zinc-400">${o.topicsDone === TOPICS.length ? 'All 12 topics are complete. Here is how to turn that into interview speed.' : `${o.topicsDone} of ${TOPICS.length} topics complete. Finish them first, then follow this plan.`}</p>
  <ol class="mt-6 relative border-l-2 border-stone-200 dark:border-zinc-800 ml-3 space-y-5">
    ${steps.map((s, i) => `<li class="pl-6 relative"><span class="absolute -left-[15px] top-0 w-7 h-7 rounded-full bg-orange-500 text-white font-mono text-xs font-semibold grid place-items-center">${i + 1}</span>
      <div class="${card} p-4"><div class="font-semibold">${s[0]}</div><div class="mt-1 text-sm text-stone-600 dark:text-zinc-400">${s[1]}</div></div></li>`).join('')}
  </ol>
  <a href="#/topics" class="mt-6 inline-block text-sm text-orange-600 dark:text-orange-400 hover:underline">&larr; Back to topics</a></div>`;
}

/* -------------------------------------------------------------- ROUTER */
function parseRoute() {
  const m = (location.hash || '#/intro').replace(/^#\/?/, '').split('/');
  return { name: m[0] || 'intro', id: parseInt(m[1], 10) };
}

function render() {
  const r = parseRoute();
  renderNav(r.name);
  const app = document.getElementById('app');
  app.innerHTML = r.name === 'topics' ? pageTopics()
                : r.name === 'topic' ? pageTopic(r.id)
                : r.name === 'next' ? pageNext()
                : pageIntro();
  bind();
}

function bind() {
  const form = document.getElementById('userForm');
  if (form) form.addEventListener('submit', e => { e.preventDefault(); syncUser(document.getElementById('userInput').value); });
  document.querySelectorAll('.syncBtn').forEach(b => b.addEventListener('click', () => syncUser(state.username)));
  document.querySelectorAll('.hideBtn').forEach(b => b.addEventListener('click', () => { state.hideSolved = !state.hideSolved; lsSet('dsa.hide', state.hideSolved); render(); }));
  document.querySelectorAll('.qlink').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openProblem(a.dataset.num, a.dataset.title); }));
  const win = document.getElementById('winSel');
  if (win) win.addEventListener('change', () => { state.windowDays = parseInt(win.value, 10); lsSet('dsa.window', state.windowDays); render(); });
  const reset = document.getElementById('resetBtn');
  if (reset) reset.addEventListener('click', () => {
    if (!state.username || !confirm('Clear saved progress for ' + state.username + '? You can re-sync recent submissions afterwards.')) return;
    delete state.solved[state.username]; lsSet('dsa.solved', state.solved); render();
  });
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('dsa.theme', dark ? 'dark' : 'light'); } catch (e) {}
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
if (state.username && (!state.lastSync || Date.now() - state.lastSync > 10 * 60 * 1000)) syncUser(state.username);
</script>
</body>
</html>
