/* ------------------------------------------------------------- HELPERS */
const LEVEL = { E: ['Easy', 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300'],
                M: ['Medium', 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300'],
                H: ['Hard', 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300'] };

const slugify = t => t.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s-]+/g, '-');
const norm = t => (t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* --------------------------------------------------------------- STATE */
const state = {
  username: lsGet('dsa.username', ''),
  solved: lsGet('dsa.solved', {}),      // { username: { normTitle: timestampSeconds } }
  windowDays: lsGet('dsa.window', 0),   // 0 = every fetched submission
  profile: lsGet('dsa.profile', null),
  lastSync: lsGet('dsa.lastSync', null),
  syncing: false,
  error: ''
};
const urlCache = lsGet('dsa.urls', {});

function solvedMap() { return state.solved[state.username] || {}; }
function solvedTs(title) {
  const ts = solvedMap()[norm(title)];
  if (!ts) return 0;
  if (state.windowDays > 0 && ts < Date.now() / 1000 - state.windowDays * 86400) return 0;
  return ts;
}
function isSolved(q) { return solvedTs(q[1]) > 0; }

function topicStats(t) {
  const req = t.q.filter(q => q[2] !== 'H');
  const reqDone = req.filter(isSolved).length;
  const allDone = t.q.filter(isSolved).length;
  const cpDone = t.cp.filter(isSolved).length;
  const complete = !!state.username && reqDone === req.length && cpDone >= 4;
  const total = t.q.length + t.cp.length;
  const done = allDone + cpDone;
  return { req: req.length, reqDone, allDone, cpDone, complete, total, done, pct: Math.round(done / total * 100) };
}

function ago(ts) {
  const d = Math.floor((Date.now() / 1000 - ts) / 86400);
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 30) return d + ' days ago';
  return Math.floor(d / 30) + ' mo ago';
}

/* ----------------------------------------------------------------- API */
async function syncUser(name) {
  name = name.trim();
  if (!name) return;
  state.syncing = true; state.error = ''; render();
  try {
    const [pRes, sRes] = await Promise.all([
      fetch(`${API}/user/${encodeURIComponent(name)}`, { headers: { accept: '*/*' } }),
      fetch(`${API}/user/${encodeURIComponent(name)}/submissions?limit=100`, { headers: { accept: '*/*' } })
    ]);
    if (!pRes.ok) throw new Error(pRes.status === 404 || pRes.status === 422 ? 'User not found. Check the username.' : 'Profile request failed (' + pRes.status + ').');
    if (!sRes.ok) throw new Error('Submissions request failed (' + sRes.status + ').');
    const profile = await pRes.json();
    const subs = await sRes.json();
    if (state.username !== name) { state.username = name; }
    const map = state.solved[name] || {};
    (Array.isArray(subs) ? subs : []).forEach(s => {
      if (s.statusDisplay !== 'Accepted') return;
      const ts = parseInt(s.timestamp, 10) || 0;
      [norm(s.title), norm((s.titleSlug || '').replace(/-/g, ' '))].forEach(k => { if (k && (!map[k] || map[k] < ts)) map[k] = ts; });
    });
    state.solved[name] = map;
    state.profile = profile;
    state.lastSync = Date.now();
    lsSet('dsa.username', name); lsSet('dsa.solved', state.solved); lsSet('dsa.profile', profile); lsSet('dsa.lastSync', state.lastSync);
  } catch (e) {
    state.error = e.message && e.message !== 'Failed to fetch' ? e.message : 'Could not reach the LeetCode API. Check your connection and try again.';
  }
  state.syncing = false; render();
}

async function openProblem(num, title) {
  const fallback = `https://leetcode.com/problems/${slugify(title)}/`;
  if (urlCache[num]) { window.open(urlCache[num], '_blank', 'noopener'); return; }
  const win = window.open('', '_blank');          // opened synchronously so popup blockers allow it
  let url = fallback;
  try {
    const r = await fetch(`${API}/problem/${num}`, { headers: { accept: '*/*' } });
    if (r.ok) { const j = await r.json(); if (j.url) { url = j.url; urlCache[num] = url; lsSet('dsa.urls', urlCache); } }
  } catch (e) {}
  if (win) { win.opener = null; win.location.href = url; } else { window.open(url, '_blank', 'noopener'); }
}

}

function pageNext() {
  const done = TOPICS.filter(t => topicStats(t).complete).length;
  const steps = [
    ['Redo the skipped Hards', 'Return to every Hard problem marked optional. Start with the ones from topics 3, 4 and 8.'],
    ['Random Mediums, no topic label', 'Solve 3 to 5 random Medium problems a week and name the pattern before you write any code. Spotting the pattern is the real interview skill.'],
    ['Re-solve from memory', 'Pick 10 problems you needed hints for and solve them again cold, in C++, with a timer.'],
    ['Weekly timed set', 'Once a week, do 2 Mediums in 60 minutes with no hints. Review every miss.'],
    ['Contests', 'Join a weekly LeetCode contest. Aim to solve the first two problems in the time limit, then grow from there.'],
    ['Add depth topics', 'Tries, segment trees / Fenwick trees, bit manipulation, and advanced graphs (Bellman-Ford, Floyd-Warshall, SCC).']];
  return `
  <h1 class="text-2xl font-bold tracking-tight">Next preparation</h1>
  <p class="mt-2 text-slate-600 dark:text-slate-400">${done === TOPICS.length ? 'All 12 topics are complete. Here is how to turn that into interview speed.' : `You have completed ${done} of ${TOPICS.length} topics. Finish them first, then use this plan.`}</p>
  <div class="mt-5 grid md:grid-cols-2 gap-4">
    ${steps.map((s, i) => `<div class="${card} p-5 flex gap-3"><span class="w-7 h-7 shrink-0 rounded-full bg-indigo-600 text-white text-sm font-semibold flex items-center justify-center">${i + 1}</span><div><div class="font-medium">${s[0]}</div><div class="text-sm text-slate-600 dark:text-slate-400 mt-1">${s[1]}</div></div></div>`).join('')}
  </div>
  <div class="mt-6"><a href="#/topics" class="text-indigo-600 dark:text-indigo-400 hover:underline">&larr; Back to topics</a></div>`;
}

/* -------------------------------------------------------------- ROUTER */
function parseRoute() {
  const m = (location.hash || '#/intro').replace(/^#\/?/, '').split('/');
  return { name: m[0] || 'intro', id: parseInt(m[1], 10) };
}

function render() {
  const r = parseRoute();
  renderNav(r.name);
  const app = document.getElementById('app');
  app.innerHTML = r.name === 'topics' ? pageTopics()
                : r.name === 'topic' ? pageTopic(r.id)
                : r.name === 'next' ? pageNext()
                : pageIntro();
  bind();
}

function bind() {
  const form = document.getElementById('userForm');
  if (form) form.addEventListener('submit', e => { e.preventDefault(); syncUser(document.getElementById('userInput').value); });
  document.querySelectorAll('.syncBtn').forEach(b => b.addEventListener('click', () => syncUser(state.username)));
  document.querySelectorAll('.qlink').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); openProblem(a.dataset.num, a.dataset.title);
  }));
  const win = document.getElementById('winSel');
  if (win) win.addEventListener('change', () => { state.windowDays = parseInt(win.value, 10); lsSet('dsa.window', state.windowDays); render(); });
  const reset = document.getElementById('resetBtn');
  if (reset) reset.addEventListener('click', () => {
    if (!state.username || !confirm('Clear saved progress for ' + state.username + '? You can re-sync recent submissions afterwards.')) return;
    delete state.solved[state.username]; lsSet('dsa.solved', state.solved); render();
  });
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('dsa.theme', dark ? 'dark' : 'light'); } catch (e) {}
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
if (state.username && (!state.lastSync || Date.now() - state.lastSync > 10 * 60 * 1000)) syncUser(state.username);
</script>
</body>
</html>
