<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSA Roadmap</title>
  <script>
    try {
      var t = localStorage.getItem('dsa.theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            zinc: {
              850: '#202024'
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Clean Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-stone-50 text-stone-800 dark:bg-zinc-950 dark:text-zinc-200 antialiased font-sans min-h-screen flex flex-col selection:bg-orange-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-30 border-b border-stone-200 dark:border-zinc-800 bg-stone-50/90 dark:bg-zinc-950/90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <!-- Logo & Active Topic -->
      <div class="flex items-center gap-3 shrink-0">
        <a href="#/topics" class="flex items-center gap-2 font-black tracking-tight text-stone-900 dark:text-white">
          <span class="grid place-items-center w-7 h-7 rounded-md bg-orange-500 text-white font-mono text-xs font-black">
            {}
          </span>
          <span class="text-base sm:text-lg">DSA</span>
        </a>

        <nav class="flex items-center gap-2" id="mainNav"></nav>
      </div>

      <!-- Search Bar Visible in Header -->
      <div class="flex-1 max-w-sm hidden sm:block">
        <button id="searchBtn" class="w-full flex items-center justify-between px-3 py-1.5 rounded-xl border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 hover:border-stone-300 dark:hover:border-zinc-700 text-xs text-stone-400 transition-colors text-left" title="Search topics, patterns, or problems (Ctrl+K or /)">
          <span class="flex items-center gap-2 truncate">
            <span>🔍</span>
            <span class="text-stone-500 dark:text-zinc-400 truncate">Search topics, patterns, questions...</span>
          </span>
          <kbd class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-stone-100 dark:bg-zinc-800 border border-stone-200 dark:border-zinc-700 shrink-0 ml-2">Ctrl+K</kbd>
        </button>
      </div>

      <!-- Right Controls -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Mobile Search Button -->
        <button id="searchBtnMobile" class="sm:hidden h-8 w-8 rounded-lg border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 grid place-items-center text-xs text-stone-400">
          🔍
        </button>

        <!-- Solved Count -->
        <div id="navOverall" class="hidden md:flex items-center"></div>

        <!-- LeetCode Sync -->
        <div id="userChip" class="flex items-center"></div>

        <!-- Settings In-Place Dropdown Anchor -->
        <div class="relative" id="settingsContainer">
          <button id="navSettingsBtn" class="h-8 w-8 rounded-lg border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 hover:bg-stone-100 dark:hover:bg-zinc-800 grid place-items-center transition-colors cursor-pointer" title="Settings & Profile" aria-label="Settings">
            <svg class="w-3.5 h-3.5 text-stone-700 dark:text-zinc-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

          <!-- In-Place Small Dropdown Popover -->
          <div id="settingsDropdown" class="hidden absolute right-0 top-full mt-2 w-80 z-50 dsa-card p-4 shadow-xl border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 rounded-2xl space-y-3.5 fade-in"></div>
        </div>

        <!-- Dark / Light Theme Toggle -->
        <button id="themeBtn" class="h-8 w-8 rounded-lg border border-stone-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 hover:bg-stone-100 dark:hover:bg-zinc-800 grid place-items-center transition-colors" aria-label="Toggle theme">
          <svg class="w-3.5 h-3.5 hidden dark:block text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>
          </svg>
          <svg class="w-3.5 h-3.5 dark:hidden text-stone-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6"></main>

  <!-- Scripts: Modular & Core Only -->
  <script src="js/data/topics.js?v=1.1"></script>
  <script src="js/data/patterns-data.js?v=1.1"></script>
  <script src="js/data/visualizers.js?v=1.1"></script>

  <script src="js/state.js?v=1.1"></script>

  <script src="js/components/toast.js?v=1.1"></script>
  <script src="js/components/palette.js?v=1.1"></script>
  <script src="js/components/visualizer-ui.js?v=1.1"></script>
  <script src="js/components/nav.js?v=1.1"></script>

  <script src="js/pages/topics.js?v=1.1"></script>
  <script src="js/pages/topic-detail.js?v=1.1"></script>
  <script src="js/pages/settings.js?v=1.1"></script>

  <script src="js/app.js?v=1.1"></script>
</body>
</html>
